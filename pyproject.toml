[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "labellint"
version = "1.0.0"
description = "Offline-first annotation quality auditing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26,<2.3", "pydantic>=2.8", "pydantic-settings>=2.4",
  "typer>=0.12", "PyYAML>=6", "scikit-learn>=1.5", "scipy>=1.13",
  "pandas>=2.2", "krippendorff>=0.8", "fastapi>=0.115", "uvicorn>=0.30",
  "python-multipart>=0.0.18", "openai>=1.50", "anthropic>=0.40"
]

[project.scripts]
labellint = "labellint.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.13", "build>=1.2", "twine>=6", "pre-commit>=4", "httpx>=0.27", "types-PyYAML>=6"]
datasets = ["datasets>=3"]
embeddings = ["sentence-transformers>=3"]
nli = ["sentence-transformers>=3"]

[tool.hatch.build.targets.wheel]
packages = ["src/labellint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=labellint --cov-report=term-missing --cov-fail-under=80"
markers = ["slow: optional model or external integration tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "krippendorff.*", "datasets.*", "sentence_transformers.*"]
ignore_missing_imports = true
