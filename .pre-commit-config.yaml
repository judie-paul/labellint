repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: .venv/bin/python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/python -m ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/python -m mypy
        language: system
        pass_filenames: false
        types: [python]
